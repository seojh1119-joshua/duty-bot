<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가로형 달력 컨테이너</title>
    <style>
        /* 전체 페이지 배경 및 중앙 정렬 */
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Apple SD Gothic Neo', sans-serif;
        }

        /* 640x1400 크기 고정 및 스크롤 가능한 컨테이너 */
        .calendar-container {
            width: 640px;
            height: 1400px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow-y: auto; /* 세로 스크롤 허용 */
            box-sizing: border-box;
            padding: 24px;
            position: relative;
        }

        /* 상단 헤더 영역 */
        .header {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        /* 가로형 달력 스크롤 영역 */
        .horizontal-calendar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 30px;
            scroll-behavior: smooth;
        }

        .horizontal-calendar::-webkit-scrollbar {
            height: 6px;
        }

        .horizontal-calendar::-webkit-scrollbar-thumb {
            background-color: #ddd;
            border-radius: 3px;
        }

        /* 개별 날짜 버튼 스타일 */
        .date-btn {
            flex: 0 0 70px;
            height: 90px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .date-btn .day {
            font-size: 14px;
            color: #868e96;
            margin-bottom: 6px;
        }

        .date-btn .date {
            font-size: 18px;
            font-weight: bold;
            color: #495057;
        }

        /* 선택된 날짜 버튼 활성화 상태 */
        .date-btn.active {
            background-color: #228be6;
            border-color: #228be6;
        }

        .date-btn.active .day,
        .date-btn.active .date {
            color: #ffffff;
        }

        /* 본문 콘텐츠 영역 (스크롤 테스트용) */
        .content-section {
            margin-top: 20px;
        }

        .schedule-card {
            background-color: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #228be6;
        }

        .schedule-card h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: #333;
        }

        .schedule-card p {
            margin: 0;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="header" id="current-month">2026년 9월</div>

        <!-- 가로형 달력 버튼 리스트 -->
        <div class="horizontal-calendar" id="calendar-strip">
            <!-- 자바스크립트로 날짜 버튼이 동적 생성됩니다 -->
        </div>

        <!-- 선택된 날짜에 따른 콘텐츠 영역 -->
        <div class="content-section" id="content-area">
            <div class="schedule-card">
                <h3>일정 안내</h3>
                <p>선택한 날짜의 상세 일정이 이 곳에 표시됩니다.</p>
            </div>
        </div>
    </div>

    <script>
        // 가로형 달력 날짜 동적 생성 예시 (현재 달 기준)
        const calendarStrip = document.getElementById('calendar-strip');
        const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];

        // 오늘 날짜 기준 전후로 날짜 생성 (예: 총 30일치)
        const today = new Date();
        for (let i = -5; i <= 25; i++) {
            const d = new Date();
            d.setDate(today.getDate() + i);

            const btn = document.createElement('div');
            btn.className = `date-btn ${i === 0 ? 'active' : ''}`;
            
            const dayName = daysOfWeek[d.getDay()];
            const dateNum = d.getDate();

            btn.innerHTML = `
                <span class="day">${dayName}</span>
                <span class="date">${dateNum}</span>
            `;

            // 클릭 이벤트 처리
            btn.addEventListener('click', () => {
                document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });

            calendarStrip.appendChild(btn);
        }
    </script>
</body>
</html>
