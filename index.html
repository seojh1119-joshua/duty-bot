<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>근무 관리 시스템</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-light: #eff6ff;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --bg-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-main);
        }

        /* 1. 오늘 근무 안내 파랑 박스 (클릭 가능) */
        .today-notice {
            background-color: var(--primary-light);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .today-notice:hover {
            background-color: #dbeafe;
            transform: translateY(-1px);
        }

        /* 뷰 전환 탭 */
        .view-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            background: #f1f5f9;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* 2. 가로형 달력 스타일 */
        .horizontal-calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .calendar-cell {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 6px;
            min-height: 80px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .calendar-cell:hover {
            border-color: var(--primary-color);
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.1);
        }

        .calendar-cell .day-num {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .calendar-cell .shift-badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #f1f5f9;
            color: #475569;
            margin-top: auto;
        }

        .calendar-cell.has-shift .shift-badge {
            background: var(--primary-light);
            color: var(--primary-color);
            font-weight: 600;
        }

        /* 3. 세로형 달력 스타일 (박스형 리스트 형태) */
        .vertical-calendar {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .vertical-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .vertical-row:hover {
            border-color: var(--primary-color);
            background-color: var(--primary-light);
        }

        .vertical-date {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .vertical-shift {
            font-size: 0.9rem;
            color: #64748b;
        }

        .vertical-row.has-shift .vertical-shift {
            color: var(--primary-color);
            font-weight: 600;
        }

        /* 팝업 모달 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-content {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        .form-group select, .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-save {
            background: var(--primary-color);
            color: #ffffff;
        }

        .btn-close {
            background: #e2e8f0;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>근무 일정표</h1>

    <!-- 1. 오늘 근무 안내 파랑 박스 (클릭 시 팝업 연동) -->
    <div class="today-notice" id="todayNoticeBox" onclick="openModal('2026-09-17')">
        <span>📅 오늘 근무 안내: 2026년 9월 17일 (클릭하여 수정)</span>
        <span id="todayShiftText">[주간근무]</span>
    </div>

    <!-- 뷰 전환 탭 버튼 -->
    <div class="view-tabs">
        <button class="tab-btn active" onclick="switchView('horizontal')">가로형 달력</button>
        <button class="tab-btn" onclick="switchView('vertical')">세로형 박스 리스트</button>
    </div>

    <!-- 2. 가로형 달력 뷰 -->
    <div id="horizontalView" class="view-section active">
        <div class="horizontal-calendar" id="horizontalCalendarContainer">
            <!-- 자바스크립트로 동적 생성 -->
        </div>
    </div>

    <!-- 3. 세로형 달력 뷰 (박스형 리스트) -->
    <div id="verticalView" class="view-section">
        <div class="vertical-calendar" id="verticalCalendarContainer">
            <!-- 자바스크립트로 동적 생성 -->
        </div>
    </div>
</div>

<!-- 근무 관리 팝업 모달 -->
<div class="modal-overlay" id="shiftModal">
    <div class="modal-content">
        <div class="modal-title" id="modalDateTitle">근무 관리</div>
        <div class="form-group">
            <label for="shiftSelect">근무 형태 선택</label>
            <select id="shiftSelect">
                <option value="휴무">휴무</option>
                <option value="주간근무">주간근무</option>
                <option value="야간근무">야간근무</option>
                <option value="오후근무">오후근무</option>
            </select>
        </div>
        <div class="modal-buttons">
            <button class="btn-close" onclick="closeModal()">취소</button>
            <button class="btn-save" onclick="saveShift()">저장</button>
        </div>
    </div>
</div>

<script>
    // 임시 데이터 저장소 (날짜별 근무 정보)
    let shiftData = {
        '2026-09-17': '주간근무',
        '2026-09-18': '야간근무',
        '2026-09-20': '휴무'
    };

    let selectedDate = '';

    // 뷰 전환 함수
    function switchView(type) {
        const hView = document.getElementById('horizontalView');
        const vView = document.getElementById('verticalView');
        const btns = document.querySelectorAll('.tab-btn');

        btns.forEach(btn => btn.classList.remove('active'));

        if (type === 'horizontal') {
            hView.classList.add('active');
            vView.classList.remove('active');
            event.target.classList.add('active');
        } else {
            vView.classList.add('active');
            hView.classList.remove('active');
            event.target.classList.add('active');
        }
    }

    // 달력 렌더링 함수 (2026년 9월 기준 예시)
    function renderCalendars() {
        const hContainer = document.getElementById('horizontalCalendarContainer');
        const vContainer = document.getElementById('verticalCalendarContainer');
        
        hContainer.innerHTML = '';
        vContainer.innerHTML = '';

        // 9월 1일부터 30일까지 생성
        for (let i = 1; i <= 30; i++) {
            const dayStr = String(i).padStart(2, '0');
            const dateKey = `2026-09-${dayStr}`;
            const shift = shiftData[dateKey] || '근무 미지정';
            const hasShift = shiftData[dateKey] ? 'has-shift' : '';

            // 1. 가로형 달력 칸 생성
            const hCell = document.createElement('div');
            hCell.className = `calendar-cell ${hasShift}`;
            hCell.innerHTML = `
                <span class="day-num">${i}일</span>
                <span class="shift-badge">${shift}</span>
            `;
            hCell.onclick = () => openModal(dateKey);
            hContainer.appendChild(hCell);

            // 2. 세로형 달력 폼 (박스 리스트 형태) 생성
            const vRow = document.createElement('div');
            vRow.className = `vertical-row ${hasShift}`;
            vRow.innerHTML = `
                <span class="vertical-date">2026년 9월 ${i}일</span>
                <span class="vertical-shift">${shift}</span>
            `;
            vRow.onclick = () => openModal(dateKey);
            vContainer.appendChild(vRow);
        }

        // 오늘 안내 박스 업데이트
        updateTodayNotice();
    }

    // 오늘 근무 안내 텍스트 동기화
    function updateTodayNotice() {
        const todayKey = '2026-09-17';
        const todayShift = shiftData[todayKey] || '근무 미지정';
        document.getElementById('todayShiftText').innerText = `[${todayShift}]`;
    }

    // 모달 팝업 열기
    function openModal(dateKey) {
        selectedDate = dateKey;
        document.getElementById('modalDateTitle').innerText = `${dateKey} 근무 관리`;
        document.getElementById('shiftSelect').value = shiftData[dateKey] || '휴무';
        document.getElementById('shiftModal').classList.add('open');
    }

    // 모달 팝업 닫기
    function closeModal() {
        document.getElementById('shiftModal').classList.remove('open');
    }

    // 근무 정보 저장
    function saveShift() {
        const selectedShift = document.getElementById('shiftSelect').value;
        shiftData[selectedDate] = selectedShift;
        closeModal();
        renderCalendars(); // 화면 새로고침
    }

    // 초기 실행
    window.onload = function() {
        renderCalendars();
    };
</script>

</body>
</html>
