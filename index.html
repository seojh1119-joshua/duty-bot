<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026년 9월 숙직 근무표 인덱스</title>
    <style>
        /* 전체 페이지 배경 및 중앙 정렬 */
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        }

        /* 640x1400 크기 고정 및 스크롤 가능한 컨테이너 */
        .calendar-container {
            width: 640px;
            height: 1400px;
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1);
            overflow-y: auto; /* 세로 스크롤 허용 */
            box-sizing: border-box;
            padding: 30px;
            position: relative;
        }

        /* 상단 헤더 영역 */
        .header {
            font-size: 26px;
            font-weight: bold;
            color: #212529;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-btns button {
            background: none;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 14px;
            color: #495057;
            transition: all 0.2s;
        }

        .header-btns button:hover {
            background-color: #f1f3f5;
        }

        /* 7열 달력 그리드 영역 */
        .calendar-grid-wrapper {
            background-color: #f8f9fa;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 30px;
            border: 1px solid #e9ecef;
        }

        /* 요일 헤더 (일~토) */
        .weekdays-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            color: #868e96;
            margin-bottom: 12px;
        }

        .weekdays-row div:first-child { color: #fa5252; } /* 일요일 빨간색 */
        .weekdays-row div:last-child { color: #228be6; }  /* 토요일 파란색 */

        /* 5행 날짜 그리드 */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            /* 근무자 이름이 들어가도록 행 높이 조정 (100px로 확대) */
            grid-template-rows: repeat(5, minmax(100px, 1fr));
            gap: 8px;
        }

        /* 개별 날짜 버튼 스타일 */
        .date-cell {
            background-color: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* justify-content: flex-start; 로 변경하여 상단부터 배치 */
            justify-content: flex-start;
            padding-top: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden; /* 내용 넘침 방지 */
        }

        .date-cell:hover {
            border-color: #228be6;
            transform: translateY(-2px);
        }

        .date-cell .date-num {
            font-size: 16px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 4px;
        }

        .date-cell.other-month {
            background-color: #f1f3f
